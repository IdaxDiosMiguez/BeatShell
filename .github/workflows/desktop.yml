name: BeatShell Desktop

on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]
  pull_request:
    paths: ["desktop/**", "src/**", ".github/workflows/desktop.yml"]

env:
  PYTHONUTF8: "1"  # la consola de Windows (cp1252) no imprime → ✔ ✖

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, name: macOS Apple Silicon }
          - { os: macos-15-intel, name: macOS Intel }
          - { os: windows-latest, name: Windows }
          - { os: ubuntu-22.04, name: Linux }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias del sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libdbus-1-3

      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          pip install . "./desktop[build]"

      - name: Construir (con Deno dentro)
        run: python desktop/packaging/build.py --deno

      - name: Prueba de humo
        run: python desktop/packaging/smoke.py

      - uses: actions/upload-artifact@v4
        with:
          name: BeatShell-${{ matrix.os }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: BeatShell Desktop ${{ github.ref_name }}
          files: out/*
          draft: true
