[package]
name = "beatshell"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Reproductor de música para terminal con pixel art (reescritura en Rust)."
license = "GPL-2.0-only"

[dependencies]
anyhow = "1.0.105"
base64 = "0.22"
cpal = "0.18"
dirs = "7.0.0"
lofty = "0.25.5"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rand = "0.10.4"
ratatui = "0.30"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha1 = "0.11.0"
url = "2.5.9"
